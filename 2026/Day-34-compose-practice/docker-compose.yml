services:

  web:
    build: ./app
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  db:
    image: postgres:16-alpine
    env_file:
      - app/.env

    healthcheck:
      test: ["CMD-SHELL","pg_isready -U mydb"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: always

    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  redis:
    image: redis:latest
    networks:
      - backend

volumes:
  postgres_data:

networks:
  backend:
